name: eda-to-report
description: Profile a dataset, run the data quality gate, and deliver a findings report. Two personas, kernel env only — the harness smoke test.
inputs:
  data_path:  { type: path }
  question:   { type: string, default: "What are the main patterns and quality issues in this dataset?" }
  # `guess: unique_column` is this workflow telling the harness what a key is:
  # a column with no repeats and nothing missing. The harness offers it; it does
  # not know the word "key" and never reads the name of an input to decide.
  key_column: { type: string, required: false, default: "None", guess: unique_column }
# Which input a screen may show as the run's title, and which one names the
# table it works on. Without these the harness would have to recognise
# "question" and "data_path", which is a cartridge's vocabulary in the harness.
title_input: question
data_input: data_path
env: default

steps:
  - id: profile
    persona: marie
    instructions: steps/01-profile.md
    section: The data
    produces: [artifacts/data-profile.md, artifacts/data-profile.json]

  - id: data-gate
    persona: marie
    instructions: steps/02-data-gate.md
    needs: [profile]
    sees: []                    # works from artifacts/data-profile.json, not from inputs
    section: Data quality
    produces: [artifacts/data-gate.md]
    gate:
      kind: human
      prompt: "Data gate report is in artifacts/data-gate.md. Proceed to analysis?"

  - id: analyze
    persona: noel
    instructions: steps/03-analyze.md
    needs: [data-gate]
    section: Findings
    # No figure files: figures are `show_chart` emissions now, which are the run's
    # record rather than the workspace's. A PNG is still allowed — for a PDF or a
    # slide — but promising one would force every run to write one.
    produces: [artifacts/findings.md]

  - id: report
    persona: marie
    instructions: steps/04-report.md
    needs: [analyze]
    sees: []                    # works from the three artifacts on disk
    section: Report
    produces: [report/findings.md, report/findings.html]
