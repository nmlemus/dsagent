[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datascience-agent"
version = "2.0.0a1"
description = "DSAgent v2 — thin Deep Agents harness that loads domain cartridges (personas, skills, workflows, envs)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Noel Moreno Lemus" }]
dependencies = [
    "deepagents>=0.7",
    "langchain>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "jupyter-client>=8.0",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
# `dsagent serve` only. Pinned exactly for the two pre-1.0 packages whose APIs were
# read rather than documented (see docs/ui-slice.md §1 — `LangGraphAGUIAgent` is not
# where the AG-UI docs said it was, and the bridge's stream handling decides how the
# runner emits events); floors for the two stable ones.
ui = [
    "ag-ui-langgraph==0.0.45",
    "copilotkit==0.1.96",
    "fastapi>=0.141",
    "uvicorn>=0.53",
]
anthropic = ["langchain-anthropic"]
openai = ["langchain-openai"]
google = ["langchain-google-genai"]
dev = ["pytest>=8", "ruff", "httpx>=0.28"]  # httpx: fastapi TestClient

[project.scripts]
dsagent = "dsagent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dsagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# typer declares CLI arguments as function calls in parameter defaults; that is
# the framework's API, not a mutable-default bug.
"src/dsagent/cli.py" = ["B008"]
