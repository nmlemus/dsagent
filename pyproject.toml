[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datascience-agent"
version = "2.0.0a1"
description = "DSAgent v2 — thin Deep Agents harness that loads domain cartridges (personas, skills, workflows, envs)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Noel Moreno Lemus" }]
dependencies = [
    "deepagents>=0.7",
    "langchain>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "jupyter-client>=8.0",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
# `dsagent serve` only. Pinned exactly for the two pre-1.0 packages whose APIs were
# read rather than documented (see docs/ui-slice.md §1 — `LangGraphAGUIAgent` is not
# where the AG-UI docs said it was, and the bridge's stream handling decides how the
# runner emits events); floors for the two stable ones.
ui = [
    "ag-ui-langgraph==0.0.45",
    "copilotkit==0.1.96",
    "fastapi>=0.141",
    "uvicorn>=0.53",
    # Where a gate's interrupt waits. Floored, not pinned: it is LangGraph's own
    # checkpoint package and the API it implements is the one `langgraph` defines.
    # Without it `dsagent serve` still runs, in memory — a gate then cannot be
    # answered after a restart (docs/ui-product.md §4.3).
    "langgraph-checkpoint-sqlite>=3.1",
    # What validates a persona's Vega-Lite spec before it reaches a browser.
    # Pinned below 6 on purpose: altair 6 carries the Vega-Lite **v6** schema,
    # and the UI bundles vega-lite 5. A server that validates against a grammar
    # the renderer does not speak would pass a spec the reader cannot see, which
    # is worse than no validation. altair 5.5 ships v5.20.1; the UI is on the
    # same line. Move both together or neither.
    "altair>=5.5,<6",
    "jsonschema>=4",
    # The other half of validating a chart: `altair` checks the schema,
    # `vl-convert` compiles and draws it once. A spec can satisfy the schema and
    # still not be a chart — see `charts.validate_spec`. It is also what renders
    # PNG/SVG for a PDF export.
    "vl-convert-python>=1.7",
]
anthropic = ["langchain-anthropic"]
openai = ["langchain-openai"]
google = ["langchain-google-genai"]
dev = ["pytest>=8", "ruff", "httpx>=0.28"]  # httpx: fastapi TestClient

[project.scripts]
dsagent = "dsagent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dsagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# typer declares CLI arguments as function calls in parameter defaults; that is
# the framework's API, not a mutable-default bug.
"src/dsagent/cli.py" = ["B008"]
